<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__nav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
  >
    <div class="brand">
      <span class="brand__logo" aria-hidden="true"><mat-icon>support_agent</mat-icon></span>
      <div>
        <div class="brand__name">HelpDesk</div>
        <div class="brand__subtitle">Mesa de ayuda · TI</div>
      </div>
    </div>

    <mat-nav-list aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          #link="routerLinkActive"
          [activated]="link.isActive"
          [attr.aria-current]="link.isActive ? 'page' : null"
          (click)="closeOnHandset()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="toggleMenu()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="topbar__title">HelpDesk</span>
      } @else {
        <span class="topbar__title">Sistema interno de mesa de ayuda</span>
      }
      <span class="topbar__spacer"></span>
      <span class="topbar__area"><mat-icon>apartment</mat-icon> Área de TI</span>
    </mat-toolbar>

    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
